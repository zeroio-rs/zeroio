[package]
name = "zeroio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pure safe Rust sans-I/O core for Zeroio: congestion control (EdgeCC, BBRv3, CUBIC, NewReno), zero-copy packet parsing, SNI/QUIC inspection, TCP/UDP primitives, and deterministic network simulator."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
